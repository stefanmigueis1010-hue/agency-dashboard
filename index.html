<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Stef_life Neural Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0800;overflow:hidden;width:100vw;height:100vh;font-family:system-ui,-apple-system,sans-serif}
canvas{position:absolute;top:0;left:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
#top h1{color:#D4AF37;font-size:.8rem;letter-spacing:3px;font-weight:300;opacity:.8}
#clock{color:#D4AF37;font-size:.78rem;opacity:.6}
#tooltip{position:absolute;pointer-events:none;display:none;background:rgba(10,8,0,0.96);border:1px solid rgba(212,175,55,0.4);border-radius:8px;padding:11px 15px;min-width:170px;z-index:10}
#tooltip h3{color:#D4AF37;font-size:.82rem;margin-bottom:3px}
#tooltip p{color:#777;font-size:.7rem;line-height:1.5}
#tooltip .st{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.68rem}
#tooltip .sd{width:6px;height:6px;border-radius:50%}
#info{position:absolute;right:0;top:0;bottom:0;width:250px;background:rgba(10,8,0,0.97);border-left:1px solid rgba(212,175,55,0.2);padding:22px 18px;transform:translateX(100%);transition:transform .3s;pointer-events:all;overflow-y:auto}
#info.open{transform:translateX(0)}
#info h2{color:#D4AF37;font-size:.95rem;margin-bottom:4px}
#info .sub{color:#555;font-size:.65rem;letter-spacing:2px;margin-bottom:14px}
#info p{color:#888;font-size:.75rem;line-height:1.6;margin-bottom:12px}
#info .agents{display:flex;flex-direction:column;gap:5px}
#info .ar{display:flex;align-items:center;gap:8px;padding:5px 9px;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.12);border-radius:5px;font-size:.7rem;color:#bbb}
#info .ar .d{width:5px;height:5px;border-radius:50%;background:#333;flex-shrink:0}
#info .ar.on .d{background:#D4AF37;box-shadow:0 0 5px #D4AF37}
#close{position:absolute;top:14px;right:14px;background:none;border:none;color:#444;font-size:1rem;cursor:pointer;pointer-events:all}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 22px;display:flex;justify-content:space-between;align-items:center}
#bottom .live{display:flex;align-items:center;gap:5px;font-size:.62rem;color:#D4AF37;opacity:.6}
.pulse{width:5px;height:5px;border-radius:50%;background:#D4AF37;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#ac{color:#D4AF37;font-size:.62rem;opacity:.55}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top"><h1>STEF_LIFE · NEURAL HUB</h1><div id="clock"></div></div>
  <div id="tooltip"><h3 id="tt-n"></h3><p id="tt-d"></p><div class="st"><div class="sd" id="tt-dot"></div><span id="tt-s"></span></div></div>
  <div id="info">
    <button id="close">✕</button>
    <h2 id="i-n"></h2><div class="sub" id="i-s"></div>
    <p id="i-d"></p>
    <div class="agents" id="i-a"></div>
  </div>
  <div id="bottom"><div class="live"><div class="pulse"></div>LIVE</div><div id="ac"></div></div>
</div>
<script>
const STATUS_API='https://n8n-20bz.srv1478695.hstgr.cloud/webhook/agency-status';
const C=document.getElementById('c'), ctx=C.getContext('2d');
const BG=document.getElementById('bg'), bgc=BG.getContext('2d');
let W,H,scale,activeNodes=new Set(),hoveredNode=null,frame=0;

// LAYOUT: Nova links-mitte, Trading rechts
// Nova Hub: 30% von links, Trading Hub: 72% von links
function novaCX(){ return W*0.30; }
function novaCY(){ return H*0.50; }
function tradCX(){ return W*0.72; }
function tradCY(){ return H*0.50; }
function novaR1(){ return Math.min(W,H)*0.22; }
function tradR1(){ return Math.min(W,H)*0.18; }

// Stef_life Ring 1 — 5 Haupt-Hubs um Nova
const STEF_HUBS = [
  {id:'content-hub',  label:'Content',   sub:'MEDIA',      angle:-90, cat:'stef',    desc:'Content, Copy, Thumbnail, Shorts, SEO, YouTube.', subs:['Content','Copywriting','Thumbnail','Shorts','SEO','YouTube']},
  {id:'marketing-hub',label:'Marketing', sub:'GROWTH',     angle:-18, cat:'stef',    desc:'Marketing, Ads, PR, Email, Community, Discord.', subs:['Marketing','Ads','PR','Email','Community','Discord']},
  {id:'produkt-hub',  label:'Produkt',   sub:'BUILD',      angle:54,  cat:'stef',    desc:'Produkt, Webdesign, Branding, Automation, IT, Library.', subs:['Produkt','Webdesign','Branding','Automation','IT','Library']},
  {id:'strategy-hub', label:'Strategie', sub:'PLAN',       angle:126, cat:'stef',    desc:'Planning, Data, Analysten.', subs:['Planning','Data','Analysten']},
  {id:'qa-hub',       label:'QA',        sub:'QUALITY',    angle:198, cat:'stef',    desc:'4-Augen-Prinzip. Prüft alle Outputs.', subs:['QA Agent']},
];

// Trading Sub-Teams um Trading Hub
const TRADING_TEAMS = [
  {id:'makro',     label:'Makro',      angle:-90,  desc:'Fed, EZB, DXY, Makro.'},
  {id:'onchain',   label:'On-Chain',   angle:-38,  desc:'SOPR, MVRV, Flows.'},
  {id:'liq',       label:'Liquidation',angle:14,   desc:'OI & Funding Rate.'},
  {id:'cot',       label:'COT',        angle:66,   desc:'CFTC Net Positions.'},
  {id:'news',      label:'News',       angle:118,  desc:'Breaking News.'},
  {id:'technical', label:'Technical',  angle:170,  desc:'SMC & Struktur.'},
  {id:'bias',      label:'Bias Report',angle:222,  desc:'Tages-Bias Report.'},
];

// Stef_life Sub-Teams (Ring 2) — direkt an Hubs
const STEF_SUBS = [
  // Content-Hub
  {id:'s-content',  label:'Content',    hub:'content-hub',  angle:-120},
  {id:'s-copy',     label:'Copy',       hub:'content-hub',  angle:-90},
  {id:'s-thumb',    label:'Thumbnail',  hub:'content-hub',  angle:-60},
  {id:'s-shorts',   label:'Shorts',     hub:'content-hub',  angle:-40},
  {id:'s-seo',      label:'SEO',        hub:'content-hub',  angle:-20},
  {id:'s-yt',       label:'YouTube',    hub:'content-hub',  angle:0},
  // Marketing-Hub
  {id:'s-mktg',     label:'Marketing',  hub:'marketing-hub', angle:-48},
  {id:'s-ads',      label:'Ads',        hub:'marketing-hub', angle:-18},
  {id:'s-pr',       label:'PR',         hub:'marketing-hub', angle:12},
  {id:'s-email',    label:'Email',      hub:'marketing-hub', angle:42},
  {id:'s-comm',     label:'Community',  hub:'marketing-hub', angle:72},
  {id:'s-disc',     label:'Discord',    hub:'marketing-hub', angle:102},
  // Produkt-Hub
  {id:'s-prod',     label:'Produkt',    hub:'produkt-hub',   angle:24},
  {id:'s-web',      label:'Webdesign',  hub:'produkt-hub',   angle:54},
  {id:'s-brand',    label:'Branding',   hub:'produkt-hub',   angle:84},
  {id:'s-auto',     label:'Automation', hub:'produkt-hub',   angle:114},
  {id:'s-it',       label:'IT',         hub:'produkt-hub',   angle:144},
  {id:'s-lib',      label:'Library',    hub:'produkt-hub',   angle:174},
  // Strategy-Hub
  {id:'s-plan',     label:'Planning',   hub:'strategy-hub',  angle:96},
  {id:'s-data',     label:'Data',       hub:'strategy-hub',  angle:126},
  {id:'s-anal',     label:'Analysten',  hub:'strategy-hub',  angle:156},
];

function deg2rad(d){ return d*Math.PI/180; }

function hubPos(hub){
  const r=novaR1(), a=deg2rad(hub.angle);
  return {x:novaCX()+Math.cos(a)*r, y:novaCY()+Math.sin(a)*r};
}
function tradPos(t){
  const r=tradR1(), a=deg2rad(t.angle);
  return {x:tradCX()+Math.cos(a)*r, y:tradCY()+Math.sin(a)*r};
}
function subPos(sub){
  const hub=STEF_HUBS.find(h=>h.id===sub.hub);
  if(!hub) return {x:novaCX(),y:novaCY()};
  const hp=hubPos(hub);
  // Sub ist weiter außen vom Hub
  const novaP={x:novaCX(),y:novaCY()};
  const dx=hp.x-novaP.x, dy=hp.y-novaP.y;
  const len=Math.hypot(dx,dy);
  const a=deg2rad(sub.angle);
  const subR=novaR1()*0.52;
  return {x:hp.x+Math.cos(a)*subR*scale/scale, y:hp.y+Math.sin(a)*subR*scale/scale};
}

function resize(){
  W=C.width=BG.width=window.innerWidth;
  H=C.height=BG.height=window.innerHeight;
  scale=Math.min(W,H)/900;
  // Sterne
  bgc.clearRect(0,0,W,H);
  for(let i=0;i<280;i++){
    bgc.beginPath(); bgc.arc(Math.random()*W,Math.random()*H,Math.random()*1.3,0,Math.PI*2);
    bgc.fillStyle=`rgba(212,175,55,${Math.random()*0.1})`; bgc.fill();
  }
}
window.addEventListener('resize',()=>{resize();});

// Partikel
const particles=[];
let ptick=0;
function spawnParticle(x1,y1,x2,y2,col){
  particles.push({x1,y1,x2,y2,t:0,speed:0.02+Math.random()*0.02,col});
}
function updateParticles(){
  ptick++;
  if(ptick%10===0){
    activeNodes.forEach(id=>{
      // Von Nova zu Hub
      const hub=STEF_HUBS.find(h=>h.id===id);
      if(hub){const p=hubPos(hub); spawnParticle(novaCX(),novaCY(),p.x,p.y,'rgba(212,175,55,0.9)'); return;}
      // Von Trading Hub zu Sub
      const tt=TRADING_TEAMS.find(t=>t.id===id);
      if(tt){const p=tradPos(tt); spawnParticle(tradCX(),tradCY(),p.x,p.y,'rgba(0,212,255,0.9)'); return;}
      // Von Hub zu Sub
      const sub=STEF_SUBS.find(s=>s.id===id);
      if(sub){const hub2=STEF_HUBS.find(h=>h.id===sub.hub); if(hub2){const hp=hubPos(hub2),sp=subPos(sub); spawnParticle(hp.x,hp.y,sp.x,sp.y,'rgba(212,175,55,0.8)');}}
    });
  }
  for(let i=particles.length-1;i>=0;i--){
    particles[i].t+=particles[i].speed;
    if(particles[i].t>=1) particles.splice(i,1);
  }
}

function drawParticles(){
  particles.forEach(p=>{
    const x=p.x1+(p.x2-p.x1)*p.t, y=p.y1+(p.y2-p.y1)*p.t;
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  });
}

function drawLine(x1,y1,x2,y2,col,w,dash){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=col; ctx.lineWidth=w;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.stroke(); ctx.setLineDash([]);
}

function drawCircleNode(x,y,r,fillCol,strokeCol,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fillCol; ctx.fill();
  ctx.strokeStyle=strokeCol; ctx.lineWidth=lw; ctx.stroke();
}

function drawGlow(x,y,r,col){
  const g=ctx.createRadialGradient(x,y,0,x,y,r*2.5);
  g.addColorStop(0,col.replace('1)','0.35)')); g.addColorStop(1,col.replace('1)','0)'));
  ctx.beginPath(); ctx.arc(x,y,r*2.5,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
}

function label(x,y,text,size,col,bold){
  ctx.fillStyle=col; ctx.font=`${bold?'600':'400'} ${size}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}

function render(){
  ctx.clearRect(0,0,W,H);
  const s=scale;

  // === ORBIT RINGE um Nova ===
  ctx.beginPath(); ctx.arc(novaCX(),novaCY(),novaR1(),0,Math.PI*2);
  ctx.strokeStyle='rgba(212,175,55,0.08)'; ctx.lineWidth=1; ctx.stroke();

  // === ORBIT RING um Trading ===
  ctx.beginPath(); ctx.arc(tradCX(),tradCY(),tradR1(),0,Math.PI*2);
  ctx.strokeStyle='rgba(0,212,255,0.08)'; ctx.lineWidth=1; ctx.stroke();

  // === VERBINDUNG Nova ↔ Trading Hub ===
  drawLine(novaCX(),novaCY(),tradCX(),tradCY(),'rgba(212,175,55,0.2)',1.2,[5,5]);

  // === LINIEN Nova → Stef Hubs ===
  STEF_HUBS.forEach(hub=>{
    const p=hubPos(hub), active=activeNodes.has(hub.id);
    const alpha=active?0.6:0.15;
    drawLine(novaCX(),novaCY(),p.x,p.y,`rgba(212,175,55,${alpha})`,active?1.5:0.8);
  });

  // === LINIEN Stef Hubs → Subs ===
  STEF_SUBS.forEach(sub=>{
    const p=subPos(sub), hub=STEF_HUBS.find(h=>h.id===sub.hub);
    if(!hub) return;
    const hp=hubPos(hub), active=activeNodes.has(sub.id);
    const alpha=active?0.5:0.1;
    drawLine(hp.x,hp.y,p.x,p.y,`rgba(212,175,55,${alpha})`,active?1.2:0.5);
  });

  // === LINIEN Trading Hub → Teams ===
  TRADING_TEAMS.forEach(t=>{
    const p=tradPos(t), active=activeNodes.has(t.id);
    const alpha=active?0.6:0.15;
    drawLine(tradCX(),tradCY(),p.x,p.y,`rgba(0,212,255,${alpha})`,active?1.5:0.8);
  });

  updateParticles(); drawParticles();

  // === TRADING HUB ===
  const tActive=activeNodes.has('trading-hub');
  if(tActive) drawGlow(tradCX(),tradCY(),26*s,'rgba(0,212,255,1)');
  drawCircleNode(tradCX(),tradCY(),26*s,'rgba(0,12,20,0.9)','rgba(0,212,255,0.9)',tActive?2:1.5);
  label(tradCX(),tradCY()-8*s,'Trading',11*s,'#00d4ff',true);
  label(tradCX(),tradCY()+6*s,'ZENTRALE',7*s,'rgba(0,212,255,0.5)',false);

  // === TRADING TEAM NODES ===
  TRADING_TEAMS.forEach(t=>{
    const p=tradPos(t), active=activeNodes.has(t.id), hov=hoveredNode&&hoveredNode.id===t.id;
    const r=11*s;
    if(active) drawGlow(p.x,p.y,r,'rgba(0,212,255,1)');
    drawCircleNode(p.x,p.y,r, active?'rgba(0,40,60,0.9)':'rgba(10,8,0,0.8)', active?'#00d4ff':'rgba(0,212,255,0.45)', active||hov?1.5:0.8);
    const col=active?'#fff':hov?'#00d4ff':'rgba(0,212,255,0.7)';
    label(p.x,p.y+r+9*s,t.label,7.5*s,col,active);
  });

  // === NOVA HUB ===
  const novaActive=activeNodes.has('nova');
  drawGlow(novaCX(),novaCY(),38*s,'rgba(212,175,55,1)');
  drawCircleNode(novaCX(),novaCY(),38*s,'rgba(20,15,0,0.9)','rgba(212,175,55,0.9)',2);
  label(novaCX(),novaCY()-10*s,'Nova',13*s,'#D4AF37',true);
  label(novaCX(),novaCY()+5*s,'NORA HUB',7*s,'rgba(212,175,55,0.5)',false);

  // Telegram
  const tgY=novaCY()-38*s-28*s;
  ctx.beginPath(); ctx.arc(novaCX(),tgY,10*s,0,Math.PI*2);
  ctx.fillStyle='rgba(0,136,204,0.25)'; ctx.fill();
  ctx.strokeStyle='rgba(0,136,204,0.7)'; ctx.lineWidth=1; ctx.stroke();
  label(novaCX(),tgY,'TG',7*s,'#4fc3f7',false);
  drawLine(novaCX(),tgY+10*s,novaCX(),novaCY()-38*s,'rgba(0,136,204,0.3)',0.7,[3,3]);
  label(novaCX(),tgY-16*s,'Stefan',7*s,'rgba(0,136,204,0.6)',false);

  // === STEF HUBS ===
  STEF_HUBS.forEach(hub=>{
    const p=hubPos(hub), active=activeNodes.has(hub.id), hov=hoveredNode&&hoveredNode.id===hub.id;
    const r=14*s;
    if(active) drawGlow(p.x,p.y,r,'rgba(212,175,55,1)');
    drawCircleNode(p.x,p.y,r, active?'rgba(30,22,0,0.9)':'rgba(10,8,0,0.85)', active?'#D4AF37':'rgba(212,175,55,0.5)', active||hov?1.5:0.8);
    const col=active?'#FFD700':hov?'#D4AF37':'rgba(212,175,55,0.7)';
    label(p.x,p.y+r+9*s,hub.label,8*s,col,active);
    label(p.x,p.y+r+18*s,hub.sub,5.5*s,'rgba(212,175,55,0.35)',false);
  });

  // === STEF SUBS ===
  STEF_SUBS.forEach(sub=>{
    const p=subPos(sub), active=activeNodes.has(sub.id), hov=hoveredNode&&hoveredNode.id===sub.id;
    const r=7*s;
    if(active) drawGlow(p.x,p.y,r,'rgba(212,175,55,1)');
    drawCircleNode(p.x,p.y,r, active?'rgba(30,22,0,0.9)':'rgba(10,8,0,0.8)', active?'#D4AF37':'rgba(212,175,55,0.3)', active||hov?1.2:0.5);
    const col=active?'#FFD700':hov?'#ccc':'rgba(212,175,55,0.5)';
    label(p.x,p.y+r+7*s,sub.label,6*s,col,false);
  });

  requestAnimationFrame(render);
}

// Hit-test
function hitTest(mx,my){
  let found=null;
  // Nova
  if(Math.hypot(mx-novaCX(),my-novaCY())<38*scale+8) return {id:'nova',label:'Nova · Nora Hub',desc:'Zentrale KI. Koordiniert alle 30 Teams.',subs:['Nova (Assistentin)','Nora (CEO)','Dispatcher'],cat:'stef',sub:'HUB'};
  // Trading Hub
  if(Math.hypot(mx-tradCX(),my-tradCY())<26*scale+8) return {id:'trading-hub',label:'Trading Zentrale',desc:'Koordiniert alle 7 Trading-Teams.',subs:TRADING_TEAMS.map(t=>t.label),cat:'trading',sub:'ZENTRALE'};
  // Trading Teams
  TRADING_TEAMS.forEach(t=>{const p=tradPos(t); if(Math.hypot(mx-p.x,my-p.y)<11*scale+8) found={id:t.id,label:t.label,desc:t.desc,subs:[],cat:'trading',sub:'TRADING'};});
  if(found) return found;
  // Stef Hubs
  STEF_HUBS.forEach(h=>{const p=hubPos(h); if(Math.hypot(mx-p.x,my-p.y)<14*scale+8) found={id:h.id,label:h.label,desc:h.desc,subs:h.subs,cat:'stef',sub:h.sub};});
  if(found) return found;
  // Subs
  STEF_SUBS.forEach(s=>{const p=subPos(s); if(Math.hypot(mx-p.x,my-p.y)<7*scale+8) found={id:s.id,label:s.label,desc:'Sub-Agent',subs:[],cat:'stef',sub:'TEAM'};});
  return found;
}

function openInfo(n){
  document.getElementById('i-n').textContent=n.label;
  document.getElementById('i-s').textContent=n.sub||'';
  document.getElementById('i-d').textContent=n.desc||'';
  const ag=document.getElementById('i-a'); ag.innerHTML='';
  (n.subs||[]).forEach(a=>{
    const r=document.createElement('div');
    r.className='ar'+(activeNodes.has(n.id)?' on':'');
    r.innerHTML=`<div class="d"></div>${a}`;
    ag.appendChild(r);
  });
  document.getElementById('info').classList.add('open');
}

C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const n=hitTest(mx,my);
  hoveredNode=n;
  const tt=document.getElementById('tooltip');
  if(n){
    tt.style.display='block'; tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-8)+'px';
    document.getElementById('tt-n').textContent=n.label;
    document.getElementById('tt-d').textContent=n.desc||'';
    const act=activeNodes.has(n.id);
    document.getElementById('tt-dot').style.background=act?'#00ff78':'#555';
    document.getElementById('tt-s').textContent=act?'AKTIV':'BEREIT';
    C.style.cursor='pointer';
  } else { tt.style.display='none'; C.style.cursor='default'; }
});

C.addEventListener('click',e=>{
  const r=C.getBoundingClientRect();
  const n=hitTest(e.clientX-r.left,e.clientY-r.top);
  if(n) openInfo(n);
});

C.addEventListener('touchend',e=>{
  const t=e.changedTouches[0], r=C.getBoundingClientRect();
  const n=hitTest(t.clientX-r.left,t.clientY-r.top);
  if(n) openInfo(n);
},{passive:true});

document.getElementById('close').onclick=()=>document.getElementById('info').classList.remove('open');

setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('de-DE'); },1000);

async function pollStatus(){
  try{
    const r=await fetch(STATUS_API,{headers:{'Cache-Control':'no-cache'}});
    const d=await r.json();
    activeNodes.clear();
    (d.events||[]).forEach(ev=>{
      const id=ev.agent;
      activeNodes.add(id);
    });
    const c=activeNodes.size;
    document.getElementById('ac').textContent=c>0?`${c} Agent${c>1?'s':''} aktiv`:'Alle bereit';
  }catch(e){}
  setTimeout(pollStatus,3000);
}

resize();
render();
pollStatus();
</script>
</body>
</html>
