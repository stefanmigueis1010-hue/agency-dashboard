<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Stef_life Neural Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0800;overflow:hidden;width:100vw;height:100vh;font-family:system-ui,-apple-system,sans-serif}
canvas{position:absolute;top:0;left:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
#top h1{color:#D4AF37;font-size:.85rem;letter-spacing:3px;font-weight:300;opacity:.8}
#clock{color:#D4AF37;font-size:.8rem;opacity:.6}
#tooltip{position:absolute;pointer-events:none;display:none;background:rgba(10,8,0,0.95);border:1px solid rgba(212,175,55,0.4);border-radius:8px;padding:12px 16px;min-width:180px}
#tooltip h3{color:#D4AF37;font-size:.85rem;margin-bottom:4px}
#tooltip p{color:#888;font-size:.72rem;line-height:1.5}
#tooltip .status{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.7rem}
#tooltip .dot{width:7px;height:7px;border-radius:50%}
#info{position:absolute;right:0;top:0;bottom:0;width:260px;background:rgba(10,8,0,0.97);border-left:1px solid rgba(212,175,55,0.2);padding:24px 20px;transform:translateX(100%);transition:transform .3s;pointer-events:all}
#info.open{transform:translateX(0)}
#info h2{color:#D4AF37;font-size:1rem;margin-bottom:6px}
#info .sub{color:#666;font-size:.7rem;letter-spacing:2px;margin-bottom:16px}
#info p{color:#999;font-size:.78rem;line-height:1.6;margin-bottom:14px}
#info .agents{display:flex;flex-direction:column;gap:6px}
#info .agent-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(212,175,55,0.05);border:1px solid rgba(212,175,55,0.15);border-radius:6px;font-size:.72rem;color:#ccc}
#info .agent-row .d{width:6px;height:6px;border-radius:50%;background:#333}
#info .agent-row.active .d{background:#D4AF37;box-shadow:0 0 6px #D4AF37}
#close{position:absolute;top:16px;right:16px;background:none;border:none;color:#555;font-size:1rem;cursor:pointer}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
#bottom .live{display:flex;align-items:center;gap:6px;font-size:.65rem;color:#D4AF37;opacity:.7}
#bottom .live .pulse{width:6px;height:6px;border-radius:50%;background:#D4AF37;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#active-count{color:#D4AF37;font-size:.65rem;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <h1>STEF_LIFE · NEURAL HUB</h1>
    <div id="clock"></div>
  </div>
  <div id="tooltip">
    <h3 id="tt-name"></h3>
    <p id="tt-desc"></p>
    <div class="status"><div class="dot" id="tt-dot"></div><span id="tt-status"></span></div>
  </div>
  <div id="info">
    <button id="close">✕</button>
    <h2 id="i-name"></h2>
    <div class="sub" id="i-cat"></div>
    <p id="i-desc"></p>
    <div class="agents" id="i-agents"></div>
  </div>
  <div id="bottom">
    <div class="live"><div class="pulse"></div>LIVE</div>
    <div id="active-count"></div>
  </div>
</div>

<script>
const STATUS_API = 'https://n8n-20bz.srv1478695.hstgr.cloud/webhook/agency-status';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, scale;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
  scale = Math.min(W,H) / 900;
  drawAll();
}
window.addEventListener('resize', resize);

// Nodes definition
const NODES = [
  // Zentrum
  {id:'nova', label:'Nova', sub:'NORA HUB', ring:0, angle:0, cat:'center', desc:'Zentrale KI. Empfängt alle Befehle von Stefan via Telegram und koordiniert alle 30 Teams.', subagents:['Nova (Assistentin)','Nora (CEO)','Dispatcher']},

  // Ring 1 — 6 Haupt-Abteilungen
  {id:'content-hub', label:'Content', sub:'MEDIA', ring:1, angle:0, cat:'stef', desc:'Content, Copywriting, Thumbnail, Shorts, SEO, YouTube.', subagents:['Content Team','Copywriting','Thumbnail','Shorts','SEO','YouTube']},
  {id:'marketing-hub', label:'Marketing', sub:'GROWTH', ring:1, angle:60, cat:'stef', desc:'Marketing, Ads, PR, Email, Community, Discord.', subagents:['Marketing','Ads','PR','Email','Community','Discord']},
  {id:'produkt-hub', label:'Produkt', sub:'BUILD', ring:1, angle:120, cat:'stef', desc:'Produkt, Webdesign, Branding, Automation, IT, Library.', subagents:['Produkt','Webdesign','Branding','Automation','IT','Library']},
  {id:'trading-hub', label:'Trading', sub:'ZENTRALE', ring:1, angle:180, cat:'trading', desc:'Makro, On-Chain, Liquidations, COT, News, Technical, Bias Report.', subagents:['Makro','On-Chain','Liquidations','COT','News','Technical','Bias Report']},
  {id:'strategy-hub', label:'Strategie', sub:'PLAN', ring:1, angle:240, cat:'stef', desc:'Planning, Data, Analysten.', subagents:['Planning','Data','Analysten']},
  {id:'qa-hub', label:'QA', sub:'QUALITY', ring:1, angle:300, cat:'stef', desc:'4-Augen-Prinzip. Prüft alle Outputs vor Versand.', subagents:['QA Agent']},

  // Ring 2 — Sub-Teams
  {id:'content',    label:'Content',    sub:'', ring:2, angle:350, cat:'stef', desc:'Video-Ideen, Content-Plan, Kalender.', subagents:[]},
  {id:'copy',       label:'Copy',       sub:'', ring:2, angle:10,  cat:'stef', desc:'Titel, Hooks, Sales-Texte.', subagents:[]},
  {id:'thumb',      label:'Thumb',      sub:'', ring:2, angle:25,  cat:'stef', desc:'Thumbnail-Konzepte.', subagents:[]},
  {id:'shorts',     label:'Shorts',     sub:'', ring:2, angle:40,  cat:'stef', desc:'Kurzvideos & Clips.', subagents:[]},
  {id:'seo',        label:'SEO',        sub:'', ring:2, angle:55,  cat:'stef', desc:'Keywords & Ranking.', subagents:[]},
  {id:'yt',         label:'YouTube',    sub:'', ring:2, angle:70,  cat:'stef', desc:'Analytics & Wachstum.', subagents:[]},
  {id:'mktg',       label:'Marketing',  sub:'', ring:2, angle:50,  cat:'stef', desc:'Funnel & Affiliate.', subagents:[]},
  {id:'ads',        label:'Ads',        sub:'', ring:2, angle:65,  cat:'stef', desc:'Werbeanzeigen.', subagents:[]},
  {id:'pr',         label:'PR',         sub:'', ring:2, angle:80,  cat:'stef', desc:'Kooperationen & Sponsoring.', subagents:[]},
  {id:'email',      label:'Email',      sub:'', ring:2, angle:95,  cat:'stef', desc:'Newsletter & Sequenzen.', subagents:[]},
  {id:'comm',       label:'Community',  sub:'', ring:2, angle:110, cat:'stef', desc:'Discord & Telegram.', subagents:[]},
  {id:'disc',       label:'Discord',    sub:'', ring:2, angle:125, cat:'stef', desc:'Tickets & Server.', subagents:[]},
  {id:'prod',       label:'Produkt',    sub:'', ring:2, angle:110, cat:'stef', desc:'Kurse & Mentoring.', subagents:[]},
  {id:'web',        label:'Webdesign',  sub:'', ring:2, angle:125, cat:'stef', desc:'Landing Pages.', subagents:[]},
  {id:'brand',      label:'Branding',   sub:'', ring:2, angle:140, cat:'stef', desc:'Logo & Identität.', subagents:[]},
  {id:'auto',       label:'Automation', sub:'', ring:2, angle:155, cat:'stef', desc:'n8n Workflows.', subagents:[]},
  {id:'it',         label:'IT',         sub:'', ring:2, angle:170, cat:'stef', desc:'Dashboards & Webhooks.', subagents:[]},
  {id:'lib',        label:'Library',    sub:'', ring:2, angle:185, cat:'stef', desc:'Wissen & PDFs.', subagents:[]},
  {id:'makro',      label:'Makro',      sub:'', ring:2, angle:160, cat:'trading', desc:'Fed, EZB, DXY.', subagents:[]},
  {id:'onchain',    label:'On-Chain',   sub:'', ring:2, angle:175, cat:'trading', desc:'SOPR, MVRV, Flows.', subagents:[]},
  {id:'liq',        label:'Liquidation',sub:'', ring:2, angle:190, cat:'trading', desc:'OI & Funding Rate.', subagents:[]},
  {id:'cot',        label:'COT',        sub:'', ring:2, angle:205, cat:'trading', desc:'CFTC Net Positions.', subagents:[]},
  {id:'news',       label:'News',       sub:'', ring:2, angle:220, cat:'trading', desc:'Breaking News.', subagents:[]},
  {id:'tech',       label:'Technical',  sub:'', ring:2, angle:235, cat:'trading', desc:'SMC & Struktur.', subagents:[]},
  {id:'bias',       label:'Bias Report',sub:'', ring:2, angle:250, cat:'trading', desc:'Tages-Bias.', subagents:[]},
  {id:'plan',       label:'Planning',   sub:'', ring:2, angle:230, cat:'stef', desc:'Strategie & OKRs.', subagents:[]},
  {id:'data',       label:'Data',       sub:'', ring:2, angle:245, cat:'stef', desc:'KPIs & Metriken.', subagents:[]},
  {id:'analyst',    label:'Analysten',  sub:'', ring:2, angle:260, cat:'stef', desc:'Deep-Dives.', subagents:[]},
];

// Radien
const R = {0: 0, 1: 220, 2: 390};

// Positionen berechnen
function getPos(node){
  const r = R[node.ring] * scale;
  const a = (node.angle - 90) * Math.PI / 180;
  return {x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r};
}

// Aktive Nodes (von API)
let activeNodes = new Set();
let hoveredNode = null;

// Farben
function nodeColor(node, active){
  if(node.ring === 0) return active ? '#FFD700' : '#D4AF37';
  if(node.cat === 'trading') return active ? '#00ffff' : '#00d4ff';
  return active ? '#FFD700' : '#D4AF37';
}

// Netz im Zentrum zeichnen (wie WSS Hub)
function drawNet(){
  const netPoints = [];
  const count = 80;
  const seed = Date.now() * 0.0001;
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2 + seed;
    const r2 = (R[1]*0.6 + Math.sin(i*2.3+seed)*R[1]*0.25) * scale;
    netPoints.push({x: cx+Math.cos(a)*r2, y: cy+Math.sin(a)*r2});
  }
  ctx.strokeStyle = 'rgba(212,175,55,0.06)';
  ctx.lineWidth = 0.5;
  for(let i=0;i<netPoints.length;i++){
    for(let j=i+1;j<netPoints.length;j++){
      const d = Math.hypot(netPoints[i].x-netPoints[j].x, netPoints[i].y-netPoints[j].y);
      if(d < 80*scale){
        ctx.beginPath();
        ctx.moveTo(netPoints[i].x, netPoints[i].y);
        ctx.lineTo(netPoints[j].x, netPoints[j].y);
        ctx.stroke();
      }
    }
  }
}

// Orbit-Ringe
function drawOrbits(){
  [1,2].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, cy, R[r]*scale, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(212,175,55,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

// Verbindungslinien
function drawLines(){
  NODES.forEach(node => {
    if(node.ring === 0) return;
    const pos = getPos(node);
    let parentId = node.ring === 1 ? 'nova' : null;
    if(node.ring === 2){
      // Verbinde zu Hub basierend auf cat + angle-Nähe
      const hubs = NODES.filter(n => n.ring === 1);
      let closest = null, minDiff = 999;
      hubs.forEach(h => {
        const diff = Math.abs(((node.angle - h.angle + 540)%360) - 180);
        if(diff < minDiff){ minDiff=diff; closest=h; }
      });
      parentId = closest ? closest.id : 'nova';
    }
    const parent = NODES.find(n => n.id === parentId);
    if(!parent) return;
    const ppos = getPos(parent);
    const active = activeNodes.has(node.id);
    const pactive = activeNodes.has(parentId);
    const alpha = (active || pactive) ? 0.5 : 0.12;
    const col = node.cat==='trading' ? `rgba(0,212,255,${alpha})` : `rgba(212,175,55,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(ppos.x, ppos.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = col;
    ctx.lineWidth = (active||pactive) ? 1.5 : 0.7;
    ctx.stroke();
  });
}

// Partikel auf aktiven Linien
const particles = [];
let pTick = 0;

function updateParticles(){
  pTick++;
  // Neue Partikel für aktive Nodes
  if(pTick % 8 === 0){
    activeNodes.forEach(id => {
      const node = NODES.find(n => n.id === id);
      if(!node || node.ring===0) return;
      const pos = getPos(node);
      const hubId = node.ring===1 ? 'nova' : (() => {
        const hubs = NODES.filter(n=>n.ring===1);
        let cl=null,md=999;
        hubs.forEach(h=>{const d=Math.abs(((node.angle-h.angle+540)%360)-180);if(d<md){md=d;cl=h;}});
        return cl?cl.id:'nova';
      })();
      const hub = NODES.find(n=>n.id===hubId);
      if(!hub) return;
      const hpos = getPos(hub);
      const col = node.cat==='trading'?'rgba(0,212,255,0.9)':'rgba(212,175,55,0.9)';
      particles.push({x:hpos.x,y:hpos.y,tx:pos.x,ty:pos.y,t:0,speed:0.025,col});
    });
  }
  // Partikel bewegen
  for(let i=particles.length-1;i>=0;i--){
    particles[i].t+=particles[i].speed;
    if(particles[i].t>=1) particles.splice(i,1);
  }
}

function drawParticles(){
  particles.forEach(p=>{
    const x=p.x+(p.tx-p.x)*p.t, y=p.y+(p.ty-p.y)*p.t;
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  });
}

// Nodes zeichnen
function drawNodes(){
  NODES.forEach(node => {
    const pos = getPos(node);
    const active = activeNodes.has(node.id);
    const hovered = hoveredNode && hoveredNode.id === node.id;
    const col = nodeColor(node, active);
    const isCenter = node.ring === 0;

    // Glow bei aktiv
    if(active || isCenter){
      ctx.beginPath();
      const gR = isCenter ? 45*scale : (node.ring===1?22:14)*scale;
      const grad = ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,gR*2);
      const gc = node.cat==='trading'?'rgba(0,212,255,':'rgba(212,175,55,';
      grad.addColorStop(0, gc+(active?'0.3)':'0.15)'));
      grad.addColorStop(1, gc+'0)');
      ctx.fillStyle=grad;
      ctx.arc(pos.x,pos.y,gR*2,0,Math.PI*2);
      ctx.fill();
    }

    // Kreis
    const r = isCenter ? 38*scale : (node.ring===1?16:9)*scale;
    ctx.beginPath(); ctx.arc(pos.x,pos.y,r,0,Math.PI*2);
    if(isCenter){
      const g=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,r);
      g.addColorStop(0,'rgba(212,175,55,0.3)');
      g.addColorStop(1,'rgba(212,175,55,0.05)');
      ctx.fillStyle=g;
    } else {
      ctx.fillStyle = active ? (node.cat==='trading'?'rgba(0,212,255,0.2)':'rgba(212,175,55,0.2)') : 'rgba(10,8,0,0.8)';
    }
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = isCenter ? 2 : (active||hovered?1.5:0.8);
    ctx.stroke();

    // Text
    const fontSize = isCenter ? 13*scale : (node.ring===1?10:8)*scale;
    ctx.fillStyle = hovered||active ? '#fff' : col;
    ctx.font = `${isCenter?'600':node.ring===1?'500':'400'} ${fontSize}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(isCenter){
      ctx.fillText('Nova', pos.x, pos.y-6*scale);
      ctx.font = `300 ${9*scale}px system-ui`;
      ctx.fillStyle='rgba(212,175,55,0.6)';
      ctx.fillText('NORA HUB', pos.x, pos.y+8*scale);
    } else {
      const labelY = pos.y + r + 12*scale;
      ctx.fillText(node.label, pos.x, labelY);
      if(node.sub && node.ring===1){
        ctx.font=`300 ${7*scale}px system-ui`;
        ctx.fillStyle='rgba(212,175,55,0.5)';
        ctx.fillText(node.sub, pos.x, labelY+10*scale);
      }
    }
  });
}

// Telegram Icon oben
function drawTelegram(){
  const tx2 = cx, ty2 = 20*scale;
  ctx.beginPath(); ctx.arc(tx2,ty2,10*scale,0,Math.PI*2);
  ctx.fillStyle='rgba(0,136,204,0.3)'; ctx.fill();
  ctx.strokeStyle='rgba(0,136,204,0.8)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`${9*scale}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('TG',tx2,ty2);
  // Linie zu Nova
  const novaPos = getPos(NODES[0]);
  ctx.beginPath(); ctx.moveTo(tx2,ty2+10*scale); ctx.lineTo(novaPos.x,novaPos.y-38*scale);
  ctx.strokeStyle='rgba(0,136,204,0.3)'; ctx.lineWidth=0.7; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(0,136,204,0.6)'; ctx.font=`${7*scale}px system-ui`;
  ctx.fillText('Stefan', tx2, ty2-14*scale);
}

let frame=0;
function drawAll(){
  ctx.clearRect(0,0,W,H);
  // Sterne-Hintergrund
  if(frame===0){
    for(let i=0;i<200;i++){
      ctx.beginPath(); ctx.arc(Math.random()*W,Math.random()*H,Math.random()*1.2,0,Math.PI*2);
      ctx.fillStyle=`rgba(212,175,55,${Math.random()*0.15})`; ctx.fill();
    }
  }
  drawOrbits();
  drawNet();
  drawLines();
  updateParticles();
  drawParticles();
  drawNodes();
  drawTelegram();
  frame++;
  requestAnimationFrame(drawAll);
}

resize();

// Sterne separat (statisch)
const bgCanvas = document.createElement('canvas');
bgCanvas.style.cssText='position:fixed;top:0;left:0;z-index:-1';
bgCanvas.width=window.innerWidth; bgCanvas.height=window.innerHeight;
document.body.appendChild(bgCanvas);
const bgCtx=bgCanvas.getContext('2d');
for(let i=0;i<250;i++){
  bgCtx.beginPath(); bgCtx.arc(Math.random()*bgCanvas.width,Math.random()*bgCanvas.height,Math.random()*1.5,0,Math.PI*2);
  bgCtx.fillStyle=`rgba(212,175,55,${Math.random()*0.12})`; bgCtx.fill();
}

// Hover
canvas.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  let found=null;
  NODES.forEach(node=>{
    const pos=getPos(node);
    const r=(node.ring===0?38:node.ring===1?16:9)*scale;
    if(Math.hypot(mx-pos.x,my-pos.y)<r+8) found=node;
  });
  hoveredNode=found;
  const tt=document.getElementById('tooltip');
  if(found){
    tt.style.display='block';
    tt.style.left=(e.clientX+16)+'px';
    tt.style.top=(e.clientY-10)+'px';
    document.getElementById('tt-name').textContent=found.label+(found.sub?' · '+found.sub:'');
    document.getElementById('tt-desc').textContent=found.desc||'';
    const active=activeNodes.has(found.id);
    const dot=document.getElementById('tt-dot');
    dot.style.background=active?'#00ff78':'#555';
    document.getElementById('tt-status').textContent=active?'AKTIV — ARBEITET GERADE':'BEREIT';
    tt.style.color=active?'#00ff78':'#888';
    canvas.style.cursor='pointer';
  } else {
    tt.style.display='none';
    canvas.style.cursor='default';
  }
});

// Click
canvas.addEventListener('click', e=>{
  if(!hoveredNode) return;
  const n=hoveredNode;
  document.getElementById('i-name').textContent=n.label;
  document.getElementById('i-cat').textContent=n.sub||n.cat.toUpperCase();
  document.getElementById('i-desc').textContent=n.desc||'';
  const agentsEl=document.getElementById('i-agents');
  agentsEl.innerHTML='';
  (n.subagents||[]).forEach(a=>{
    const row=document.createElement('div');
    const active=activeNodes.has(n.id);
    row.className='agent-row'+(active?' active':'');
    row.innerHTML=`<div class="d"></div>${a}`;
    agentsEl.appendChild(row);
  });
  document.getElementById('info').classList.add('open');
});
document.getElementById('close').onclick=()=>document.getElementById('info').classList.remove('open');

// Touch
let lastTouch={};
canvas.addEventListener('touchend', e=>{
  const t=e.changedTouches[0];
  const rect=canvas.getBoundingClientRect();
  const mx=t.clientX-rect.left, my=t.clientY-rect.top;
  NODES.forEach(node=>{
    const pos=getPos(node);
    const r=(node.ring===0?38:node.ring===1?16:9)*scale+10;
    if(Math.hypot(mx-pos.x,my-pos.y)<r){
      hoveredNode=node;
      canvas.dispatchEvent(new MouseEvent('click'));
    }
  });
});

// Clock
setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('de-DE');
},1000);

// Status API pollen
async function pollStatus(){
  try{
    const r=await fetch(STATUS_API);
    const d=await r.json();
    const prev=new Set(activeNodes);
    activeNodes.clear();
    (d.events||[]).forEach(e=>{
      const node=NODES.find(n=>n.id===e.agent||n.label.toLowerCase()===e.agent.toLowerCase());
      if(node) activeNodes.add(node.id);
    });
    const count=activeNodes.size;
    document.getElementById('active-count').textContent=count>0?`${count} Agent${count>1?'s':''} aktiv`:'Alle bereit';
  }catch(e){}
  setTimeout(pollStatus,3000);
}
pollStatus();
</script>
</body>
</html>
