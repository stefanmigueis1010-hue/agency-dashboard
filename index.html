<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Stef_life Agency HQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060612;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;width:100vw}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,6,18,0.9);border-bottom:1px solid rgba(212,175,55,0.3);z-index:100;backdrop-filter:blur(10px)}
#hud h1{font-size:1rem;font-weight:700;color:#D4AF37;letter-spacing:2px}
#hud .stats{font-size:.75rem;color:#888;display:flex;gap:16px}
#hud .stats span{color:#D4AF37}
#canvas-wrap{position:absolute;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#canvas-wrap:active{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
.room{position:absolute;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .3s;backdrop-filter:blur(4px);user-select:none}
.room.gold{background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.4)}
.room.cyan{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.4)}
.room.green{background:rgba(0,255,120,0.06);border:1px solid rgba(0,255,120,0.4)}
.room.center{background:rgba(212,175,55,0.12);border:2px solid rgba(212,175,55,0.8)}
.room.center2{background:rgba(0,212,255,0.12);border:2px solid rgba(0,212,255,0.8)}
.room.active.gold{box-shadow:0 0 20px rgba(212,175,55,0.8),0 0 40px rgba(212,175,55,0.4);border-color:#D4AF37}
.room.active.cyan{box-shadow:0 0 20px rgba(0,212,255,0.8),0 0 40px rgba(0,212,255,0.4);border-color:#00d4ff}
.room.active.green{box-shadow:0 0 20px rgba(0,255,120,0.8);border-color:#00ff78}
.room .name{font-size:.62rem;font-weight:600;text-align:center;padding:0 6px;line-height:1.2}
.room.gold .name{color:#D4AF37}
.room.cyan .name{color:#00d4ff}
.room.green .name{color:#00ff78}
.room.center .name{color:#D4AF37;font-size:.85rem;font-weight:800}
.room.center2 .name{color:#00d4ff;font-size:.85rem;font-weight:800}
.dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.active{background:#00ff78;box-shadow:0 0 6px #00ff78;animation:pulse 1s infinite}
.dot.ready{background:#D4AF37}
.dot.idle{background:#444}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.7}}
#tooltip{position:fixed;pointer-events:none;background:rgba(10,10,30,0.95);border:1px solid rgba(212,175,55,0.5);border-radius:8px;padding:10px 14px;font-size:.8rem;z-index:200;display:none;backdrop-filter:blur(10px)}
#tooltip .t-name{font-weight:700;color:#D4AF37;margin-bottom:4px}
#tooltip .t-status{color:#888}
#info-panel{position:fixed;right:0;top:48px;bottom:0;width:280px;background:rgba(10,10,30,0.97);border-left:1px solid rgba(212,175,55,0.3);padding:20px;z-index:150;transform:translateX(100%);transition:transform .3s;backdrop-filter:blur(20px)}
#info-panel.open{transform:translateX(0)}
#info-panel h2{color:#D4AF37;font-size:1rem;margin-bottom:8px}
#info-panel .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;margin-bottom:12px}
#info-panel .tag.gold{background:rgba(212,175,55,0.2);color:#D4AF37;border:1px solid rgba(212,175,55,0.4)}
#info-panel .tag.cyan{background:rgba(0,212,255,0.2);color:#00d4ff;border:1px solid rgba(0,212,255,0.4)}
#info-panel p{font-size:.8rem;color:#aaa;line-height:1.6;margin-bottom:12px}
#info-panel .task{background:rgba(255,255,255,0.04);border-radius:6px;padding:10px;font-size:.75rem;color:#ccc}
#info-panel .task-label{color:#888;font-size:.65rem;margin-bottom:4px}
#close-panel{position:absolute;top:16px;right:16px;background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer}
#live-bar{position:fixed;bottom:0;left:0;right:0;height:32px;background:rgba(6,6,18,0.9);border-top:1px solid rgba(212,175,55,0.2);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:100;overflow:hidden}
#live-bar .lb-label{font-size:.65rem;color:#D4AF37;font-weight:700;white-space:nowrap}
#live-ticker{font-size:.65rem;color:#888;white-space:nowrap;animation:ticker 30s linear infinite}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
svg#lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
</style>
</head>
<body>
<div id="hud">
  <h1>⚡ STEF_LIFE AGENCY HQ</h1>
  <div class="stats">
    <div>Agents aktiv: <span id="stat-active">0</span></div>
    <div>Teams: <span>30</span></div>
    <div id="clock"></div>
  </div>
</div>
<div id="canvas-wrap">
  <div id="world">
    <svg id="lines"></svg>
  </div>
</div>
<div id="tooltip"><div class="t-name"></div><div class="t-status"></div></div>
<div id="info-panel">
  <button id="close-panel">✕</button>
  <h2 id="ip-name">—</h2>
  <span id="ip-tag" class="tag gold">Stef_life Agentur</span>
  <p id="ip-desc">—</p>
  <div class="task"><div class="task-label">AKTUELLER TASK</div><div id="ip-task">—</div></div>
</div>
<div id="live-bar">
  <div class="lb-label">● LIVE</div>
  <div id="live-ticker">Stef_life Agency HQ — Alle Systeme aktiv — Trading Zentrale online — Nova koordiniert 30 Teams — Automation läuft — Content Pipeline aktiv</div>
</div>

<script>
const ROOMS = [
  // Zentrum Stef_life
  {id:'nova',name:'Nova + Nora\nHub',type:'center',x:380,y:220,w:130,h:80,cat:'Stef_life',desc:'Zentrale KI-Koordination. Nova empfängt alle Aufgaben, Nora leitet die Agentur.',tasks:['Anfragen routen','Teams koordinieren','CEO Briefing']},
  // Ring 1 — Content & Media
  {id:'content',name:'Content',type:'gold',x:160,y:80,w:90,h:55,cat:'Stef_life',desc:'Video-Ideen, Themen, Content-Plan & Kalender.',tasks:['Content-Kalender erstellen','Video-Ideen generieren','Posting-Plan']},
  {id:'copy',name:'Copywriting',type:'gold',x:260,y:50,w:90,h:55,cat:'Stef_life',desc:'Titel, Beschreibungen, Hooks, Sales-Texte, Captions.',tasks:['YouTube Titel optimieren','Hook schreiben','Caption erstellen']},
  {id:'thumb',name:'Thumbnail',type:'gold',x:370,y:40,w:90,h:55,cat:'Stef_life',desc:'Thumbnail-Konzepte, Design-Briefs, Cover-Gestaltung.',tasks:['Thumbnail-Konzept entwickeln','Design-Brief erstellen']},
  {id:'shorts',name:'Shorts',type:'gold',x:470,y:50,w:90,h:55,cat:'Stef_life',desc:'Kurzvideos, Clips, Reels aus bestehenden Videos.',tasks:['Shorts schneiden','Clip auswählen']},
  {id:'seo',name:'SEO',type:'gold',x:560,y:80,w:90,h:55,cat:'Stef_life',desc:'Keywords, Tags, Ranking-Optimierung.',tasks:['Keyword-Recherche','Tags optimieren']},
  {id:'youtube',name:'YouTube',type:'gold',x:600,y:170,w:90,h:55,cat:'Stef_life',desc:'YouTube Analytics, Views, Wachstum, Statistiken.',tasks:['Analytics auswerten','Wachstum analysieren']},
  // Ring 2 — Marketing
  {id:'marketing',name:'Marketing',type:'gold',x:560,y:280,w:90,h:55,cat:'Stef_life',desc:'Funnel, Affiliate, BitUnix, Verkauf.',tasks:['Funnel optimieren','Affiliate tracken']},
  {id:'ads',name:'Ads',type:'gold',x:600,y:360,w:90,h:55,cat:'Stef_life',desc:'Werbung, Instagram-Anzeigen, Kampagnen.',tasks:['Ad-Kampagne erstellen','Budget optimieren']},
  {id:'pr',name:'PR',type:'gold',x:540,y:430,w:90,h:55,cat:'Stef_life',desc:'Podcast, Kooperationen, Sponsoring.',tasks:['Kooperation anfragen','PR-Text erstellen']},
  {id:'email',name:'Email',type:'gold',x:450,y:460,w:90,h:55,cat:'Stef_life',desc:'Newsletter, Sequenzen, Listen-Management.',tasks:['Newsletter erstellen','Sequenz aufbauen']},
  {id:'community',name:'Community',type:'gold',x:350,y:470,w:90,h:55,cat:'Stef_life',desc:'Discord, Community-Management, Telegram.',tasks:['Community moderieren','Engagement steigern']},
  {id:'discord',name:'Discord',type:'gold',x:250,y:460,w:90,h:55,cat:'Stef_life',desc:'Discord-Tickets, Server-Management.',tasks:['Tickets bearbeiten','Channels verwalten']},
  // Ring 3 — Produkt & Tech
  {id:'produkt',name:'Produkt',type:'gold',x:160,y:410,w:90,h:55,cat:'Stef_life',desc:'Neue Kurse, Mentoring, Produkt-Entwicklung.',tasks:['Kurs-Konzept erstellen','Preise kalkulieren']},
  {id:'webdesign',name:'Webdesign',type:'gold',x:90,y:340,w:90,h:55,cat:'Stef_life',desc:'Website, Landing Pages, Funnel-Design.',tasks:['Landing Page bauen','Funnel designen']},
  {id:'branding',name:'Branding',type:'gold',x:70,y:260,w:90,h:55,cat:'Stef_life',desc:'Logo, Farben, visuelle Identität.',tasks:['Brand Guide erstellen','Logo anpassen']},
  {id:'automation',name:'Automation',type:'gold',x:90,y:170,w:90,h:55,cat:'Stef_life',desc:'n8n Workflows, Prozess-Automatisierung.',tasks:['Workflow bauen','Prozess automatisieren']},
  {id:'it',name:'IT',type:'gold',x:130,y:100,w:90,h:55,cat:'Stef_life',desc:'Dashboards, Webhooks, Infrastruktur.',tasks:['Dashboard deployen','Webhook einrichten']},
  {id:'library',name:'Library',type:'gold',x:210,y:420,w:90,h:55,cat:'Stef_life',desc:'Bücher, PDFs, Wissen archivieren.',tasks:['PDF archivieren','Wissen strukturieren']},
  {id:'planning',name:'Planning',type:'gold',x:320,y:100,w:90,h:55,cat:'Stef_life',desc:'Jahresplan, Strategie, OKRs, Roadmap.',tasks:['Q4 Roadmap planen','OKRs definieren']},
  {id:'data',name:'Data',type:'gold',x:490,y:120,w:90,h:55,cat:'Stef_life',desc:'KPIs, Dashboards, Metriken.',tasks:['KPIs auswerten','Report erstellen']},
  {id:'analyst',name:'Analysten',type:'gold',x:200,y:160,w:90,h:55,cat:'Stef_life',desc:'Deep-Dives, Marktanalysen, Reports.',tasks:['Markt analysieren','Report schreiben']},
  // Trading Zentrale — Zentrum
  {id:'trading-hub',name:'Trading\nZentrale',type:'center2',x:880,y:220,w:120,h:75,cat:'Trading',desc:'Zentrale Trading-Intelligenz. Koordiniert alle 7 Trading-Teams.',tasks:['Bias berechnen','Markt überwachen']},
  // Trading Teams
  {id:'makro',name:'Makro',type:'cyan',x:820,y:80,w:90,h:55,cat:'Trading',desc:'Fed, EZB, DXY, Makro-Wirtschaft.',tasks:['DXY analysieren','Fed-Erwartungen prüfen']},
  {id:'onchain',name:'On-Chain',type:'cyan',x:940,y:60,w:90,h:55,cat:'Trading',desc:'SOPR, MVRV, Exchange Flows.',tasks:['SOPR auswerten','Exchange Flows checken']},
  {id:'liq',name:'Liquidations',type:'cyan',x:1050,y:110,w:90,h:55,cat:'Trading',desc:'OI, Funding Rate, Coinglass-Daten.',tasks:['OI überwachen','Funding Rate checken']},
  {id:'cot',name:'COT',type:'cyan',x:1080,y:220,w:90,h:55,cat:'Trading',desc:'CFTC, Net Positions, COT-Index.',tasks:['COT-Report auswerten','Net Positions berechnen']},
  {id:'news',name:'News',type:'cyan',x:1050,y:330,w:90,h:55,cat:'Trading',desc:'Breaking News, Events, Nachrichten.',tasks:['News überwachen','Events tracken']},
  {id:'technical',name:'Technical',type:'cyan',x:940,y:390,w:90,h:55,cat:'Trading',desc:'SMC, Order Blocks, FVG, Struktur.',tasks:['Chart analysieren','SMC-Struktur prüfen']},
  {id:'bias',name:'Bias Report',type:'cyan',x:820,y:380,w:90,h:55,cat:'Trading',desc:'Tages-Bias, Reports, Zusammenfassungen.',tasks:['Bias berechnen','Daily Report erstellen']},
  // QA
  {id:'qa',name:'QA',type:'green',x:580,y:480,w:80,h:50,cat:'QA',desc:'4-Augen-Prinzip. Prüft alle Outputs vor Versand.',tasks:['Output prüfen','QA-Check durchführen']}
];

const world = document.getElementById('world');
const svg = document.getElementById('lines');
const wrap = document.getElementById('canvas-wrap');

// World-Größe
const W = 1220, H = 600;
world.style.width = W+'px';
world.style.height = H+'px';
svg.setAttribute('width', W);
svg.setAttribute('height', H);

// Zoom/Pan State
let scale = 1, tx = 0, ty = 0;
let dragging = false, lastX = 0, lastY = 0;

function applyTransform(){
  world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

// Initial: zentriert im Viewport
function initView(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight - 32;
  scale = Math.min(vw/W, vh/H) * 0.9;
  tx = (vw - W*scale)/2;
  ty = (vh - H*scale)/2;
  applyTransform();
}
initView();
window.addEventListener('resize', initView);

// Scroll-Zoom
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(4, Math.max(0.3, scale * delta));
  tx = mx - (mx - tx) * (newScale/scale);
  ty = my - (my - ty) * (newScale/scale);
  scale = newScale;
  applyTransform();
}, {passive:false});

// Drag
wrap.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX=e.clientX; lastY=e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => dragging=false);

// Touch
let touches = {};
wrap.addEventListener('touchstart', e => {
  [...e.changedTouches].forEach(t => touches[t.identifier]={x:t.clientX,y:t.clientY});
});
wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1){
    const t = e.touches[0];
    const prev = touches[t.identifier];
    if(prev){ tx += t.clientX-prev.x; ty += t.clientY-prev.y; applyTransform(); }
    touches[t.identifier]={x:t.clientX,y:t.clientY};
  } else if(e.touches.length === 2){
    const [a,b] = [...e.touches];
    const pa = touches[a.identifier], pb = touches[b.identifier];
    if(pa&&pb){
      const distPrev = Math.hypot(pa.x-pb.x,pa.y-pb.y);
      const distNow = Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      const delta = distNow/distPrev;
      const cx = (a.clientX+b.clientX)/2, cy = (a.clientY+b.clientY)/2;
      const rect = wrap.getBoundingClientRect();
      const mx=cx-rect.left, my=cy-rect.top;
      const newScale = Math.min(4,Math.max(0.3,scale*delta));
      tx = mx-(mx-tx)*(newScale/scale); ty = my-(my-ty)*(newScale/scale);
      scale=newScale; applyTransform();
    }
    touches[a.identifier]={x:a.clientX,y:a.clientY};
    touches[b.identifier]={x:b.clientX,y:b.clientY};
  }
},{passive:false});
wrap.addEventListener('touchend', e => {
  [...e.changedTouches].forEach(t => delete touches[t.identifier]);
});

// SVG Lines
const centerNodes = ROOMS.filter(r => r.type==='center'||r.type==='center2');
ROOMS.forEach(r => {
  if(r.type==='center'||r.type==='center2') return;
  const hub = r.cat==='Trading' ? centerNodes.find(c=>c.id==='trading-hub') : centerNodes.find(c=>c.id==='nova');
  if(!hub) return;
  const x1=hub.x+hub.w/2, y1=hub.y+hub.h/2, x2=r.x+r.w/2, y2=r.y+r.h/2;
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1);
  line.setAttribute('x2',x2); line.setAttribute('y2',y2);
  const col = r.type==='cyan'?'rgba(0,212,255,0.15)':r.type==='green'?'rgba(0,255,120,0.2)':'rgba(212,175,55,0.15)';
  line.setAttribute('stroke',col); line.setAttribute('stroke-width','1');
  svg.appendChild(line);
});

// Verbindung Nova ↔ Trading Hub
const novaHub=ROOMS.find(r=>r.id==='nova'), tradHub=ROOMS.find(r=>r.id==='trading-hub');
const connLine = document.createElementNS('http://www.w3.org/2000/svg','line');
connLine.setAttribute('x1',novaHub.x+novaHub.w); connLine.setAttribute('y1',novaHub.y+novaHub.h/2);
connLine.setAttribute('x2',tradHub.x); connLine.setAttribute('y2',tradHub.y+tradHub.h/2);
connLine.setAttribute('stroke','rgba(212,175,55,0.3)'); connLine.setAttribute('stroke-width','1.5');
connLine.setAttribute('stroke-dasharray','4,4');
svg.appendChild(connLine);

// Animierte Partikel auf Lines
const particles = [];
function addParticle(x1,y1,x2,y2,col){
  particles.push({x1,y1,x2,y2,col,t:Math.random(),speed:0.003+Math.random()*0.004});
}
ROOMS.forEach(r=>{
  if(r.type==='center'||r.type==='center2') return;
  const hub = r.cat==='Trading'?tradHub:novaHub;
  const col = r.type==='cyan'?'rgba(0,212,255,0.8)':r.type==='green'?'rgba(0,255,120,0.8)':'rgba(212,175,55,0.8)';
  addParticle(hub.x+hub.w/2,hub.y+hub.h/2,r.x+r.w/2,r.y+r.h/2,col);
});

// Canvas für Partikel
const pCanvas = document.createElement('canvas');
pCanvas.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:1';
pCanvas.width=W; pCanvas.height=H;
world.appendChild(pCanvas);
const ctx = pCanvas.getContext('2d');

function animParticles(){
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{
    p.t=(p.t+p.speed)%1;
    const x=p.x1+(p.x2-p.x1)*p.t, y=p.y1+(p.y2-p.y1)*p.t;
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  });
  requestAnimationFrame(animParticles);
}
animParticles();

// Rooms erstellen
const roomEls = {};
const tooltip = document.getElementById('tooltip');

ROOMS.forEach(r=>{
  const el = document.createElement('div');
  el.className='room '+r.type;
  el.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;z-index:2`;
  el.innerHTML=`<div class="name">${r.name}</div><div class="dot idle"></div>`;
  el.addEventListener('mouseenter', e=>{
    tooltip.style.display='block';
    tooltip.querySelector('.t-name').textContent=r.name.replace('\n',' ');
    const status = el.classList.contains('active')?'🟢 Aktiv':'🟡 Bereit';
    tooltip.querySelector('.t-status').textContent=status+' — '+r.cat;
  });
  el.addEventListener('mousemove', e=>{
    tooltip.style.left=(e.clientX+14)+'px';
    tooltip.style.top=(e.clientY-10)+'px';
  });
  el.addEventListener('mouseleave',()=>tooltip.style.display='none');
  el.addEventListener('click',()=>openPanel(r));
  world.appendChild(el);
  roomEls[r.id]=el;
});

// Info Panel
const panel=document.getElementById('info-panel');
document.getElementById('close-panel').onclick=()=>panel.classList.remove('open');
const fakeTasks=['Daten analysieren...','Report generieren...','Webhook aufrufen...','Output prüfen...','Task abgeschlossen ✓','Warte auf Input...'];

function openPanel(r){
  document.getElementById('ip-name').textContent=r.name.replace('\n',' ');
  const tag=document.getElementById('ip-tag');
  tag.textContent=r.cat; tag.className='tag '+(r.type==='cyan'?'cyan':'gold');
  document.getElementById('ip-desc').textContent=r.desc;
  const t=r.tasks[Math.floor(Math.random()*r.tasks.length)];
  document.getElementById('ip-task').textContent=t;
  panel.classList.add('open');
}

// Live-Status Simulation
let activeCount = 0;
function activateRandom(){
  const eligible = ROOMS.filter(r=>r.type!=='center'&&r.type!=='center2');
  const r = eligible[Math.floor(Math.random()*eligible.length)];
  const el = roomEls[r.id];
  const dot = el.querySelector('.dot');
  el.classList.add('active'); dot.className='dot active';
  activeCount++;
  document.getElementById('stat-active').textContent=activeCount;
  setTimeout(()=>{
    el.classList.remove('active');
    dot.className='dot ready';
    activeCount = Math.max(0,activeCount-1);
    document.getElementById('stat-active').textContent=activeCount;
  },4000);
}
setInterval(activateRandom, 2000);
activateRandom(); activateRandom(); activateRandom();

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000); updateClock();
</script>
</body>
</html>
